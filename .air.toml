# Dev server: `make backend` rebuilds and restarts it on every Go or SQL change.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  entrypoint = ["./tmp/server"]
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "uploads"]
  exclude_regex = ["_test\\.go$"]
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  main_only = true

[misc]
  clean_on_exit = true
